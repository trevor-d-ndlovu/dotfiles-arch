# Close windows with SUPER+Q (was SUPER+W in defaults)
unbind = SUPER, W
bindd = SUPER, Q, Close window, killactive,

# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm app -- xdg-terminal-exec --dir="$(akatsuki-cmd-terminal-cwd)" tmux new
$terminal = uwsm app -- xdg-terminal-exec
$browser = akatsuki-launch-browser

bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(akatsuki-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, akatsuki-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, M, Music, exec, akatsuki-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, akatsuki-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, akatsuki-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, akatsuki-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, akatsuki-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, akatsuki-launch-or-focus signal "uwsm app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, akatsuki-launch-or-focus obsidian "uwsm app -- obsidian"
bindd = SUPER SHIFT, slash, Passwords, exec, uwsm app -- 1password

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER SHIFT, A, ChatGPT, exec, akatsuki-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, akatsuki-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, akatsuki-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, akatsuki-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, akatsuki-launch-or-focus-webapp YouTube "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, akatsuki-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, akatsuki-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, X, X, exec, akatsuki-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, akatsuki-launch-webapp "https://x.com/compose/post"

# Laptop function keys
bindd = , F1, Mute, exec, swayosd-client --output-volume mute-toggle
bindd = , F2, Volume down, exec, swayosd-client --output-volume lower
bindd = , F3, Volume up, exec, swayosd-client --output-volume raise
bindd = , F4, Brightness down, exec, swayosd-client --brightness lower
bindd = , F5, Brightness up, exec, swayosd-client --brightness raise
bindd = , F6, Toggle touchpad, exec, hyprctl keyword input:touchdevice:enabled $((! $(hyprctl getoption input:touchdevice:enabled | awk 'NR==1{print $2}')))
bindd = , F9, Lock, exec, akatsuki system lock
bindd = , F10, Toggle camera, exec, ~/.config/akatsuki/scripts/toggle-camera.sh

# Overwrite existing bindings, like putting Akatsuki Menu on Super + Space
# unbind = SUPER SHIFT, SPACE
# bindd = SUPER SHIFT, SPACE, Akatsuki menu, exec, akatsuki-menu
