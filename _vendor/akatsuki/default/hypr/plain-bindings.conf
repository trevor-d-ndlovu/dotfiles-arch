# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm app -- xdg-terminal-exec --dir="$(akatsuki-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, akatsuki-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm app -- nautilus --new-window "$(akatsuki-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, akatsuki-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, akatsuki-launch-browser --private
bindd = SUPER SHIFT, N, Editor, exec, akatsuki-launch-editor

# Add extra bindings
# bindd = SUPER SHIFT, A, ChatGPT, exec, akatsuki-launch-webapp "https://chatgpt.com"
